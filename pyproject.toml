[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cellprose"
version = "0.3.2"
description = "A plain-text format for spreadsheet workbooks: formulas and cell addresses a model can read in one call, rendered as tables on GitHub"
readme = "README.md"
authors = [{ name = "Utkarsh Gaikwad" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["spreadsheet", "excel", "xlsx", "llm", "markdown", "mcp", "formulas"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Spreadsheet",
  "Topic :: Text Processing :: Markup :: Markdown",
]
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1", "defusedxml>=0.7"]

[project.urls]
Homepage = "https://cellprose.com"
Documentation = "https://cellprose.com/guide/"
Repository = "https://github.com/cellprose/cellprose"
Issues = "https://github.com/cellprose/cellprose/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8", "mcp>=1.2", "tiktoken"]
bench = ["anthropic>=1.12", "openai>=2", "tiktoken", "pandas>=2", "markitdown==0.1.7"]
stats = ["tiktoken"]

[project.scripts]
cellprose = "cellprose.cli:main"
cellprose-mcp = "cellprose.mcp_server:main"

[tool.hatch.build.targets.sdist]
include = ["/src/cellprose", "/README.md", "/LICENSE", "/LICENSE-SPEC", "/NOTICE"]

[tool.hatch.build.targets.wheel]
packages = ["src/cellprose"]

[tool.pytest.ini_options]
testpaths = ["tests"]
