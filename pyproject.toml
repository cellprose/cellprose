[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cellprose"
version = "0.3.0"
description = "A plain-text format for spreadsheet workbooks: formulas and cell addresses a model can read in one call, rendered as tables on GitHub"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1", "defusedxml>=0.7"]

[project.urls]
Homepage = "https://cellprose.com"
Documentation = "https://cellprose.com/guide/"
Repository = "https://github.com/Utkarsh-Gaikwad/cellprose"
Issues = "https://github.com/Utkarsh-Gaikwad/cellprose/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8", "mcp>=1.2", "tiktoken"]
bench = ["anthropic>=1.12", "openai>=2", "tiktoken", "pandas>=2", "markitdown==0.1.9"]
stats = ["tiktoken"]

[project.scripts]
cellprose = "cellprose.cli:main"
cellprose-mcp = "cellprose.mcp_server:main"

[tool.hatch.build.targets.sdist]
include = ["/src/cellprose", "/README.md", "/LICENSE", "/LICENSE-SPEC", "/NOTICE"]

[tool.hatch.build.targets.wheel]
packages = ["src/cellprose"]

[tool.pytest.ini_options]
testpaths = ["tests"]
