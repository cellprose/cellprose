name: Release

# Runs when a version tag (v0.3.0, ...) is pushed. Builds the Python packages and the npm package, then publishes
# them. Nothing is uploaded until a maintainer approves the `release` environment (Settings > Environments >
# release > Required reviewers), so pushing a tag by mistake publishes nothing.
#
# PyPI uses trusted publishing (no token): on pypi.org, add a pending publisher for each project
# (cellprose, markitdown-cellprose, langchain-cellprose, llama-index-readers-cellprose) with
# owner cellprose (the organization), repository cellprose, workflow release.yml, environment release.
# npm uses trusted publishing too: on npmjs.com, package cellprose > Settings > Trusted publisher > GitHub Actions,
# same repository, workflow and environment. Until that is set, put an automation token in the NPM_TOKEN secret.

on:
  push:
    tags: ["v*"]
  # Run by hand (Actions > Release > Run workflow) to publish only the three adapters. The core package and npm
  # are skipped, and PyPI needs each adapter registered as a pending publisher just before its job.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Tag matches the package versions
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          js=$(node -p "require('./js/package.json').version")
          echo "tag=$tag python=$py js=$js"
          test "$tag" = "$py" && test "$tag" = "$js"
      - name: Test
        run: |
          pip install -e ".[dev,mcp]" pytest
          pytest -q tests/test_writer*.py tests/test_reader*.py tests/test_vendor.py tests/test_mcp.py
          (cd js && npm test)
      - name: Build
        run: |
          pip install build twine
          python -m build -o dist/core .
          for p in markitdown-cellprose langchain-cellprose llama-index-readers-cellprose; do
            python -m build -o dist/integrations integrations/$p
          done
          twine check dist/core/* dist/integrations/*
          mkdir -p dist/npm
          (cd js && npm pack --pack-destination ../dist/npm)
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi-core:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/core/

  pypi-markitdown:
    # The adapters depend on cellprose>=0.3, so they go up after it, one at a time: PyPI allows only one pending
    # publisher for this repository, workflow and environment, so each is registered just before its job.
    needs: [build, pypi-core]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.pypi-core.result == 'success' || needs.pypi-core.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: |
          mkdir -p dist/one
          cp dist/integrations/markitdown_cellprose-* dist/one/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/one/

  pypi-langchain:
    # The adapters depend on cellprose>=0.3, so they go up after it, one at a time: PyPI allows only one pending
    # publisher for this repository, workflow and environment, so each is registered just before its job.
    needs: [build, pypi-core, pypi-markitdown]
    if: ${{ !cancelled() && needs.pypi-markitdown.result == 'success' && needs.build.result == 'success' && (needs.pypi-core.result == 'success' || needs.pypi-core.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: |
          mkdir -p dist/one
          cp dist/integrations/langchain_cellprose-* dist/one/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/one/

  pypi-llama-index:
    # The adapters depend on cellprose>=0.3, so they go up after it, one at a time: PyPI allows only one pending
    # publisher for this repository, workflow and environment, so each is registered just before its job.
    needs: [build, pypi-core, pypi-langchain]
    if: ${{ !cancelled() && needs.pypi-langchain.result == 'success' && needs.build.result == 'success' && (needs.pypi-core.result == 'success' || needs.pypi-core.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: |
          mkdir -p dist/one
          cp dist/integrations/llama_index_readers_cellprose-* dist/one/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/one/

  npm:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install -g npm@latest      # trusted publishing needs npm 11.5 or later
          npm publish dist/npm/*.tgz --access public --provenance
