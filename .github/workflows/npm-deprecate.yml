name: npm deprecate placeholder
on: workflow_dispatch
jobs:
  deprecate:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Deprecate the placeholder version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm deprecate "cellprose@0.0.0-stage" "Placeholder used to set up publishing. Use cellprose 0.3.0 or later."
